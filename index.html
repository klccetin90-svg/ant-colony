<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANT STOK SAYIM - Saha Başvuru Ekranı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: #1e293b; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #ffffff; padding: 35px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); border-top: 6px solid #ef4444; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #0f172a; font-size: 24px; margin-bottom: 6px; font-weight: 800; letter-spacing: 0.5px; }
        .header h1 span { color: #ef4444; }
        .header p { color: #64748b; font-size: 14px; }

        /* Gamification Banner */
        .promo-banner { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; padding: 16px; border-radius: 14px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .promo-banner h2 { font-size: 17px; margin-bottom: 4px; font-weight: 700; }
        .promo-banner p { font-size: 13px; opacity: 0.95; }

        /* Form Elements */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #334155; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px 15px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; color: #0f172a; font-size: 15px; transition: all 0.2s; }
        input:focus { outline: none; border-color: #0ea5e9; background: #fff; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); }

        .btn-submit { width: 100%; background: #ef4444; color: #fff; font-weight: 700; padding: 14px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; transition: background 0.2s, transform 0.1s; margin-top: 10px; text-transform: uppercase; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .btn-submit:hover { background: #dc2626; transform: translateY(-1px); }

        .footer-note { text-align: center; margin-top: 25px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>ANT <span>STOK SAYIM</span></h1>
            <p>Profesyonel Envanter ve Saha Operasyon Ekibi</p>
        </div>

        <!-- Oyunsallaştırma / Karşılama Kartı (Gold/Altın Sarısı Vurgulu) -->
        <div class="promo-banner">
            <h2>🎁 1.000 ANT Puan Hediyen Hazır!</h2>
            <p>Hemen kayıt ol; görevleri tamamla, puanları topla ve kazancını anında katla.</p>
        </div>

        <!-- Başvuru ve Kayıt Formu -->
        <form id="agentForm" onsubmit="handleRegistration(event)">
            <div class="form-group">
                <label>Ad Soyad</label>
                <input type="text" id="fullname" placeholder="Adınızı ve soyadınızı girin" required>
            </div>

            <div class="form-group">
                <label>T.C. Kimlik Numarası (Bordro İçin)</label>
                <input type="text" id="tckn" maxlength="11" placeholder="11 haneli T.C. kimlik numaranız" required>
            </div>

            <div class="form-group">
                <label>Doğum Tarihi</label>
                <input type="date" id="birthdate" required>
            </div>

            <div class="form-group">
                <label>IBAN Numarası (Yevmiye Hesabı)</label>
                <input type="text" id="iban" placeholder="TR00 0000 0000 0000 0000 0000 00" required>
            </div>

            <button type="submit" class="btn-submit">Saha Ekibine Katıl ve Başvur</button>
        </form>

        <div class="footer-note">
            ANT STOK SAYIM &copy; 2026 - Tüm Hakları Saklıdır.
        </div>
    </div>

    <script>
        function handleRegistration(e) {
            e.preventDefault();
            const name = document.getElementById('fullname').value;
            alert(`Tebrikler ${name}! Başvurunuz alındı ve 1.000 ANT Puan hesabınıza tanımlandı.`);
        }
    </script>

</body>
</html>
